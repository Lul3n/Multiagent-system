# ==============================================================================
# Workflow Individual — Scraper de Doctores (Doctoralia)
# ==============================================================================
# Ejecuta SOLO el scraper de doctores de forma independiente.
# Para el pipeline completo (scraper + traductor), usar pipeline_e2e.yml

name: Scraper de Doctores (Individual)

on:
  workflow_dispatch:

jobs:
  ejecutar-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright

      - name: Instalar Chromium para Playwright
        run: playwright install --with-deps chromium

      - name: Ejecutar Scraper de Doctores
        run: python Scrapper_info.py

      - name: Guardar datos extraídos como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-data-json
          path: doctor_data.json
          retention-days: 7