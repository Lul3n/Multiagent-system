
# Este workflow ejecuta automáticamente la cadena completa:
#   Paso 1: Scraper de Doctores (Doctoralia)
#   Paso 2: Traductor al Inglés (doctores + hoteles si existen)
#   Paso 3: Scorer/Rankeador de Hoteles (datos pre-traducidos)
#   Paso 4: Scorer/Rankeador de Doctores (datos crudos del scraper)
#   Final:  Consolidar todos los rankings y datos traducidos
# Y guarda los JSON finales como artefactos descargables en GitHub.
# ==============================================================================

name: Pipeline E2E - Sistema Multiagentes

on:
  # Ejecución diaria automática a las 06:00 UTC (11pm Sonora)
  schedule:
    - cron: '0 6 * * *'
  # Botón manual para ejecutar desde GitHub → Actions → Run workflow
  workflow_dispatch:

jobs:
  # ================================================================
  # Fase 1: Scraper de Doctores (Doctoralia)
  # ================================================================
  scraper-doctores:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright

      - name: Instalar Chromium para Playwright
        run: playwright install --with-deps chromium

      - name: Ejecutar Scraper de Doctores
        run: python Scrapper_info.py

      - name: Subir doctor_data.json como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-data-raw
          path: doctor_data.json
          retention-days: 30

  # ================================================================
  # fase 2: Traducción al Inglés
  # ================================================================
  # Se ejecuta DESPUÉS de que el scraper termine exitosamente
  traducir-datos:
    runs-on: ubuntu-latest
    needs: [scraper-doctores]
    timeout-minutes: 40

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del traductor
        run: |
          python -m pip install --upgrade pip
          pip install translators

      - name: Descargar JSON crudo del scraper
        uses: actions/download-artifact@v4
        with:
          name: doctor-data-raw
          path: translator/

      - name: Ejecutar Agente Traductor
        working-directory: translator
        run: |
          mkdir -p output
          python main.py

      - name: Subir datos traducidos como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: datos-traducidos-en
          path: translator/output/
          retention-days: 30

  # ================================================================
  # Fase 3: Scorer / Rankeador de Hoteles
  # ================================================================
  # Se ejecuta DESPUÉS de la traducción. Usa los datos de hoteles
  # ya traducidos que están en el repositorio (translator/output/).
  scorer-hoteles:
    runs-on: ubuntu-latest
    needs: [traducir-datos]
    timeout-minutes: 10

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Descargar datos traducidos del paso anterior
        uses: actions/download-artifact@v4
        with:
          name: datos-traducidos-en
          path: scorer/hotel/

      - name: Ejecutar Agente Scorer de Hoteles
        working-directory: scorer/hotel
        run: |
          python main.py hotel_data.en.json || echo "[Scorer] No se pudo ejecutar el scoring de hoteles (archivo de datos faltante)."

      - name: Subir ranking de hoteles como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranking-hoteles
          path: scorer/hotel/output/
          retention-days: 30

  # ================================================================
  # Fase 4: Scorer / Rankeador de Doctores
  # ================================================================
  # Se ejecuta DESPUÉS del scraper de doctores. Usa el JSON crudo
  # generado por el scraper (doctor_data.json).
  scorer-doctores:
    runs-on: ubuntu-latest
    needs: [scraper-doctores]
    timeout-minutes: 10

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Descargar JSON crudo del scraper
        uses: actions/download-artifact@v4
        with:
          name: doctor-data-raw
          path: scorer/doctores/

      - name: Ejecutar Agente Scorer de Doctores
        working-directory: scorer/doctores
        run: |
          python main.py doctor_data.json

      - name: Subir ranking de doctores como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranking-doctores
          path: scorer/doctores/output/
          retention-days: 30

  # Espera a que TODOS los agentes terminen y empaqueta los
  # resultados en un solo artefacto descargable.
  consolidar-datos:
    runs-on: ubuntu-latest
    needs: [traducir-datos, scorer-hoteles, scorer-doctores]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Crear directorio de datos finales
        run: mkdir -p datos-finales

      - name: Descargar datos traducidos
        uses: actions/download-artifact@v4
        with:
          name: datos-traducidos-en
          path: datos-finales/
        continue-on-error: true

      - name: Descargar ranking de hoteles
        uses: actions/download-artifact@v4
        with:
          name: ranking-hoteles
          path: datos-finales/
        continue-on-error: true

      - name: Descargar ranking de doctores
        uses: actions/download-artifact@v4
        with:
          name: ranking-doctores
          path: datos-finales/
        continue-on-error: true

      - name: Listar contenido del paquete final
        run: |
          echo "=== Contenido del paquete final ==="
          ls -la datos-finales/
          echo "==================================="

      - name: Subir paquete final con todos los datos
        uses: actions/upload-artifact@v4
        with:
          name: datos-finales-completos
          path: datos-finales/
          retention-days: 30

